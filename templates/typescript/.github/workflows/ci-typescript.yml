name: ci-typescript

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Using pnpm or yarn? Swap `npm ci` and the cache setting for the project's package manager.
      - run: npm ci
      - name: Format and lint
        run: npx biome ci .
      - name: Type check
        run: npx tsc --noEmit
      - name: Test
        run: npm test --if-present
      - name: Build
        run: npm run build --if-present
