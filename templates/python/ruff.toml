# Ruff is both the formatter and the linter. Docs: https://docs.astral.sh/ruff/
line-length = 100

[lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # isort
  "B",       # bugbear
  "UP",      # pyupgrade
  "SIM",     # simplify
  "C4",      # comprehensions
  "S",       # bandit security checks
  "N",       # pep8 naming
  "PT",      # pytest style
  "RUF",     # ruff-specific
]
ignore = ["E501"]  # the formatter owns line length

[lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]  # pytest asserts; tests run trusted commands

[format]
docstring-code-format = true
